name: DevSecOps Shift-Left Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks on working tree
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-git --redact --verbose --exit-code 1

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep
        run: |
          semgrep scan --metrics=off \
            --config p/python --config p/owasp-top-ten \
            --exclude .github \
            --error --sarif-output=semgrep.sarif .
      - name: Upload SARIF to Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

  dependency-scan:
    name: SCA (Trivy dependencies)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Trivy dependency scan
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:latest \
            fs --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 .

  container-scan:
    name: Container + IaC Scan (Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dockerfile misconfiguration scan
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:latest \
            config --severity HIGH,CRITICAL --exit-code 1 .
      - name: Build image
        if: always()
        run: docker build -t demo-app:${{ github.sha }} .
      - name: Scan image for CVEs
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 demo-app:${{ github.sha }}

  security-gate:
    name: Security Gate
    needs: [secrets-scan, sast, dependency-scan, container-scan]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any security job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "Security gate FAILED"; exit 1
          fi
          echo "Security gate PASSED"